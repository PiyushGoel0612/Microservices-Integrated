version: '3.8'

services:
  ipc-service:
    build:
      context: ./ipc
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ipc:/app
    environment:
      - PYTHONUNBUFFERED=1

  system-call-service:
    build:
      context: ./systemcall
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./systemcall:/app
    environment:
      - PYTHONUNBUFFERED=1

  memory-manager-service:
    build:
      context: ./memory_manager
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./memory_manager:/app
    environment:
      - PYTHONUNBUFFERED=1

  process-scheduler-service:
    build:
      context: ./process_scheduler
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    volumes:
      - ./process_scheduler:/app
    environment:
      - PYTHONUNBUFFERED=1

  multithreading-service:
    build:
      context: ./multithreading_service
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    volumes:
      - ./multithreading_service:/app
    environment:
      - PYTHONUNBUFFERED=1

  filesystem-service:
    build: ./filesystem
    ports:
      - "8005:8000"
    volumes:
      - ./filesystem/app:/app
    environment:
      - PYTHONUNBUFFERED=1

  deadlock-simulator-service:
    build: ./deadlock-simulator
    ports:
      - "8006:8000"
    volumes:
      - ./deadlock-simulator/app:/app
    networks:
      - virtual-labs-network
    environment:
      - PYTHONUNBUFFERED=1

  concurrency-simulator-service:
    build: ./concurrency-simulator
    ports:
      - "8007:8000"
    volumes:
      - ./concurrency-simulator/app:/app
    environment:
      - PYTHONUNBUFFERED=1 

networks:
  virtual-labs-network:
    external: true